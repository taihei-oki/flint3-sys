name: Windows

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Windows configuration to test (one job per run)
        required: true
        type: choice
        default: msvc-system-static-md
        options:
          - msvc-system-static-md
          - msvc-system-dynamic
          - msvc-bundled-cmake
          - gnu-bundled
          - gnu-bundled-gmp-mpfr
          - gnu-generated-bindings
          - gnu-system-flint

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  gnu:
    if: startsWith(inputs.configuration, 'gnu-')
    name: Windows GNU (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
      CC: gcc
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON('{
            "gnu-bundled": [
              {"name": "bundled", "features": "", "packages": ""}
            ],
            "gnu-bundled-gmp-mpfr": [
              {"name": "bundled-gmp-mpfr", "features": "gmp-mpfr-sys", "packages": ""}
            ],
            "gnu-generated-bindings": [
              {"name": "generated-bindings", "features": "run-bindgen", "packages": "clang:p"}
            ],
            "gnu-system-flint": [
              {"name": "system-flint", "features": "use-system-libs,run-bindgen", "packages": "flint:p pkgconf:p clang:p"}
            ]
          }')[inputs.configuration] }}
    steps:
      - name: Preserve shell script line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Rust
        shell: pwsh
        run: >-
          rustup toolchain install $env:RUSTUP_TOOLCHAIN
          --profile minimal --no-self-update --force-non-host

      - uses: msys2/setup-msys2@v2
        with:
          # Match the MSVCRT runtime of the official windows-gnu toolchain.
          msystem: MINGW64
          update: true
          install: >-
            autoconf
            automake
            libtool
            make
            m4
            diffutils
          pacboy: >-
            gcc:p
            gmp:p
            mpfr:p
            ${{ matrix.packages }}

      - name: Fingerprint native dependencies
        id: native
        run: |
          set -euo pipefail
          packages=$(pacman -Q | sha256sum | cut -d ' ' -f 1)
          echo "packages=$packages" >> "$(cygpath -u "$GITHUB_OUTPUT")"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}-${{ steps.native.outputs.packages }}

      - name: Test
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          set -euo pipefail
          export PATH="$(cygpath -u "$USERPROFILE")/.cargo/bin:$PATH"
          export LIBCLANG_PATH="$(cygpath -m "$MINGW_PREFIX/bin")"
          cargo test --features "$FEATURES"

  msvc:
    if: startsWith(inputs.configuration, 'msvc-')
    name: Windows MSVC (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON('{
            "msvc-system-dynamic": [
              {"name": "system-dynamic", "triplet": "x64-windows", "packages": "flint", "features": "use-system-libs,run-bindgen", "dynamic": true}
            ],
            "msvc-system-static-md": [
              {"name": "system-static-md", "triplet": "x64-windows-static-md", "packages": "flint", "features": "use-system-libs,run-bindgen", "dynamic": false}
            ],
            "msvc-bundled-cmake": [
              {"name": "bundled-cmake", "triplet": "x64-windows-static-md", "packages": "gmp mpfr pthreads", "features": "run-bindgen", "dynamic": false}
            ]
          }')[inputs.configuration] }}
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      VCPKG_COMMIT: 5dd2e1600d049b498ff9fb9fe15997533ae0c804
      VCPKGRS_TRIPLET: ${{ matrix.triplet }}
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check out vcpkg
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .ci/vcpkg
          persist-credentials: false

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Rust
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --no-self-update

      - uses: actions/setup-python@v7
        if: matrix.name == 'bundled-cmake'
        with:
          python-version: "3.13"

      - name: Prepare native dependencies
        id: native
        run: |
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE\.ci\vcpkg" >> $env:GITHUB_ENV
          "image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\vcpkg-cache" | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$env:RUNNER_TEMP\vcpkg-cache,readwrite" >> $env:GITHUB_ENV

      - name: Restore native dependency cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}\vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ env.VCPKGRS_TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ steps.native.outputs.image }}-${{ hashFiles('.github/workflows/windows.yml', '.github/vcpkg-triplets/*.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ env.VCPKGRS_TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ steps.native.outputs.image }}-${{ hashFiles('.github/workflows/windows.yml', '.github/vcpkg-triplets/*.cmake') }}-
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ env.VCPKGRS_TRIPLET }}-${{ env.VCPKG_COMMIT }}-

      - name: Bootstrap vcpkg
        run: '& "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics'

      - name: Install native dependencies
        id: install-native
        # Leave time to save diagnostics and completed packages after a timeout.
        timeout-minutes: 120
        env:
          VCPKG_PACKAGES: ${{ matrix.packages }}
        run: |
          $packages = $env:VCPKG_PACKAGES.Split(' ')
          & "$env:VCPKG_ROOT\vcpkg.exe" install --classic --triplet $env:VCPKGRS_TRIPLET --host-triplet x64-windows --overlay-triplets "$env:GITHUB_WORKSPACE\.github\vcpkg-triplets" @packages

      - name: Upload native build logs
        if: always() && steps.install-native.outcome != '' && steps.install-native.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: native-build-logs-${{ matrix.name }}-${{ github.run_attempt }}
          path: .ci/vcpkg/buildtrees/**/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Save native dependency cache
        if: always() && steps.install-native.outcome != '' && steps.install-native.outcome != 'skipped' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}\vcpkg-cache
          # Failed installs retain completed packages under a separate key, so
          # the immutable primary key remains available for a complete install.
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}${{ steps.install-native.outcome != 'success' && format('-partial-{0}-{1}', github.run_id, github.run_attempt) || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}-${{ env.VCPKGRS_TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ steps.native.outputs.image }}-${{ hashFiles('.github/workflows/windows.yml', '.github/vcpkg-triplets/*.cmake') }}

      - name: Test with regenerated MSVC bindings
        env:
          FEATURES: ${{ matrix.features }}
          DYNAMIC_LINKAGE: ${{ matrix.dynamic }}
        run: |
          if (!(Test-Path "$env:LIBCLANG_PATH\libclang.dll")) {
            throw "The runner's LLVM installation does not contain libclang.dll"
          }
          if ($env:DYNAMIC_LINKAGE -eq 'true') {
            $env:VCPKGRS_DYNAMIC = "1"
            $env:PATH = "$env:VCPKG_ROOT\installed\$env:VCPKGRS_TRIPLET\bin;$env:PATH"
          } else {
            Remove-Item Env:VCPKGRS_DYNAMIC -ErrorAction SilentlyContinue
          }
          cargo test --features $env:FEATURES
